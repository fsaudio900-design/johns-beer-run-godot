name: Release
# Pushing a version tag (v2.3, v2.4, ...) publishes a GitHub Release with the
# notes from release_notes/<tag>.md and a ready-to-import project zip attached.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the project zip
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=JohnsBeerRun/ -o "dist/JohnsBeerRun-${GITHUB_REF_NAME}.zip" HEAD
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release_notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || echo "John's Beer Run ${GITHUB_REF_NAME}" > "$NOTES"
          TITLE=$(head -n 1 "$NOTES" | sed 's/^# *//')
          gh release create "$GITHUB_REF_NAME" "dist/JohnsBeerRun-${GITHUB_REF_NAME}.zip" \
            --title "$TITLE" --notes-file "$NOTES" --latest
