name: Release
# Adding release_notes/vX.Y.md on main publishes GitHub Release vX.Y with those notes, plus:
#   - JohnsBeerRun-Setup-vX.Y.exe   the Windows installer (Godot game inside)
#   - JohnsBeerRun-Windows-vX.Y.zip the game .exe on its own (no install needed)
#   - JohnsBeerRun-vX.Y.zip         the Godot project
# The first line of the notes file is the release title.
on:
  push:
    branches: [main]
    paths: ['release_notes/*.md']
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT: 4.3-stable
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which versions need a release?
        id: todo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODO=""
          for NOTES in $(ls release_notes/v*.md | sort -V); do
            TAG=$(basename "$NOTES" .md)
            gh release view "$TAG" >/dev/null 2>&1 || TODO="$TODO $TAG"
          done
          echo "tags=$TODO" >> "$GITHUB_OUTPUT"
          echo "To publish:$TODO"
      - name: Install Godot ${{ env.GODOT }} + Windows export templates
        if: steps.todo.outputs.tags != ''
        run: |
          cd /tmp
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT}/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT}_linux.x86_64" /usr/local/bin/godot
          curl -sSLo tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT}/Godot_v${GODOT}_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT/-/.}"
          mkdir -p "$T" && unzip -q -j tpl.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d "$T"
          rm tpl.tpz
      - uses: actions/setup-go@v5
        if: steps.todo.outputs.tags != ''
        with:
          go-version: '1.22'
      - name: Export the game and build the installer
        if: steps.todo.outputs.tags != ''
        run: |
          godot --headless --import || true
          godot --headless --import
          mkdir -p build dist
          godot --headless --export-release "Windows Desktop" build/JohnsBeerRun.exe
          ls -la build
      - name: Publish
        if: steps.todo.outputs.tags != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for TAG in ${{ steps.todo.outputs.tags }}; do
            NOTES="release_notes/$TAG.md"; VER="${TAG#v}"
            TITLE=$(head -n 1 "$NOTES" | sed 's/^# *//')
            tail -n +2 "$NOTES" > dist/notes.md
            git archive --format=zip --prefix=JohnsBeerRun/ -o "dist/JohnsBeerRun-$TAG.zip" HEAD
            (cd build && zip -q -9 "../dist/JohnsBeerRun-Windows-$TAG.zip" JohnsBeerRun.exe)
            ./tools/installer/build.sh "$VER" build/JohnsBeerRun.exe dist
            gh release create "$TAG" "dist/JohnsBeerRun-Setup-$TAG.exe" "dist/JohnsBeerRun-Windows-$TAG.zip" "dist/JohnsBeerRun-$TAG.zip" \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file dist/notes.md --latest
            echo "published $TAG"
          done
