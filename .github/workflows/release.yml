name: Release
# Adding release_notes/vX.Y.md on main publishes GitHub Release vX.Y with those
# notes and a ready-to-import project zip attached. (The first line of the notes
# file is the release title.)
on:
  push:
    branches: [main]
    paths: ['release_notes/*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish any versions that don't have a release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p dist
          for NOTES in $(ls release_notes/v*.md | sort -V); do
            TAG=$(basename "$NOTES" .md)
            if gh release view "$TAG" >/dev/null 2>&1; then continue; fi
            TITLE=$(head -n 1 "$NOTES" | sed 's/^# *//')
            tail -n +2 "$NOTES" > dist/notes.md
            git archive --format=zip --prefix=JohnsBeerRun/ -o "dist/JohnsBeerRun-$TAG.zip" HEAD
            gh release create "$TAG" "dist/JohnsBeerRun-$TAG.zip" --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file dist/notes.md --latest
            echo "published $TAG"
          done
